apiVersion: v1
kind: Pod
metadata:
  name: gpu-test
spec:
  nodeSelector: {type: kwok}            # only fake GPU nodes
  tolerations:                          # permission to ignore the taint
    - {key: kwok.x-k8s.io/node, operator: Exists, effect: NoSchedule}
  containers:
    - name: train
      image: fake-image                 # never pulled, since KWOK doesn't run containers
      resources:
        limits: {nvidia.com/gpu: 4}     # for extended resources, request = limit

apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: team-a-cq
spec:
  cohortName: gpu-pool
  namespaceSelector:
    matchLabels: {kubernetes.io/metadata.name: team-a}
  queueingStrategy: BestEffortFIFO
  preemption:
    reclaimWithinCohort: Any
    withinClusterQueue: Never
  resourceGroups:
    - coveredResources: ["cpu", "memory", "nvidia.com/gpu"]
      flavors:
        - name: sim-a100
          resources:
            - {name: cpu, nominalQuota: 320}
            - {name: memory, nominalQuota: 2560Gi}
            - {name: nvidia.com/gpu, nominalQuota: 80, borrowingLimit: 80}
---

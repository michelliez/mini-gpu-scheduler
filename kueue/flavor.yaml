# One hardware type: the fake A100 nodes from M2.
# Kueue injects these nodeLabels/tolerations into admitted pods,
# so jobs don't need to know about taints or node labels.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: sim-a100
spec:
  nodeLabels:
    gpu.model: sim-a100
  tolerations:
    - key: kwok.x-k8s.io/node
      operator: Exists
      effect: NoSchedule
